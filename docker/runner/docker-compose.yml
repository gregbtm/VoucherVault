# Self-hosted GitHub Actions runner for gregbtm/VoucherVault, meant to be
# deployed as a Portainer stack on an always-on Docker host (e.g. a
# Synology NAS via Container Manager) - see ../../docs/SELF_HOSTED_RUNNER.md
# for the full setup walkthrough.
#
# Phase 1 scope: stand up ONE runner, get it showing "Idle" under this
# repo's Settings -> Actions -> Runners. No workflow jobs are pointed at
# it yet - that's Phase 2, done one job at a time via a `runs-on:` change
# in .github/workflows/conventional-commits.yml, each independently
# revertible to `ubuntu-latest`.
#
# Design choices (see the PR description / conversation for the full
# reasoning on each):
#   - Persistent, not ephemeral: this is a single trusted personal repo
#     with fork-PR workflows gated off (Settings -> Actions -> "Fork pull
#     request workflows from outside collaborators" set to require
#     approval) - the isolation ephemeral mode buys mainly matters against
#     untrusted code, which never reaches this box. One long-lived
#     container is simpler to operate than an EPHEMERAL=true + restart
#     loop.
#   - One runner, not a fleet: the host is 2 cores / 4 threads. A second
#     replica would have jobs contend for the same cores rather than
#     genuinely parallelize.
#   - Unmodified base image + mounted cache volumes, not a custom-built
#     image: keeps every workflow step exactly as it runs on
#     ubuntu-latest today (actions/setup-python, pip install, npm ci all
#     unchanged) - they just start hitting these warm volumes instead of
#     the network on repeat runs. A custom image with Python/Node/
#     ghostscript/tesseract-ocr pre-baked would start jobs faster still,
#     but couples the workflow to that image and muddies the one-line
#     `runs-on:` revert - a good Phase 2.5 optimization once this is
#     proven, not needed for the MVP.
#   - Docker socket is mounted read-write so `docker run` steps (Semgrep,
#     Grype install, the ZAP baseline scan) and Docker-based composite
#     actions (Trivy, etc.) work via the HOST's Docker daemon, matching
#     how every Synology self-hosted-runner writeup does this. This is
#     the dominant privilege grant here - the container can talk to the
#     same Docker daemon as everything else on the NAS - so the real
#     mitigation is the fork-PR gate above, not container-hardening flags
#     that add little once the socket is mounted.

services:
  vv-runner:
    image: myoung34/github-runner:ubuntu-noble
    container_name: vv-github-runner
    restart: unless-stopped
    environment:
      REPO_URL: "https://github.com/gregbtm/VoucherVault"
      # Fine-grained PAT scoped to ONLY this repo, "Administration: Read
      # and write" permission only - see docs/SELF_HOSTED_RUNNER.md for
      # how to generate it. Set via this stack's environment variables in
      # the Portainer UI, never committed here.
      ACCESS_TOKEN: "${GITHUB_RUNNER_PAT}"
      RUNNER_SCOPE: "repo"
      RUNNER_NAME: "synology-vv-nas"
      RANDOM_RUNNER_SUFFIX: "false"
      LABELS: "self-hosted,docker,vv-nas"
      RUN_AS_ROOT: "true"
      DISABLE_AUTO_UPDATE: "true"
      # We share the HOST's Docker daemon via the mounted socket below
      # rather than running dockerd inside this container - that's what
      # START_DOCKER_SERVICE controls, so it stays off.
      START_DOCKER_SERVICE: "false"
    volumes:
      # Shares the NAS's own Docker daemon - see the note above. If DSM
      # doesn't expose the daemon at this exact path, find the real one
      # with `sudo find / -name docker.sock 2>/dev/null` over SSH and
      # adjust the source (left) side.
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/_work
      # Warm caches across runs - actions/setup-python, pip install, and
      # npm ci all read/write these paths unchanged; they just stop
      # hitting the network once these are populated. RUN_AS_ROOT=true
      # above means the runner's home directory is /root.
      - pip-cache:/root/.cache/pip
      - npm-cache:/root/.npm
    mem_limit: 8g
    cpus: 1.5

volumes:
  runner-work:
  pip-cache:
  npm-cache:
