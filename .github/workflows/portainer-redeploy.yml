name: Trigger Portainer redeploy

# Companion to the in-app "Redeploy now" button (myapp/portainer.py): after
# the GHCR migration (see docs/AUTO_DEPLOY.md), Portainer stacks pull a
# prebuilt ghcr.io/gregbtm/vouchervault image instead of building from
# source, so a plain webhook ping is no longer enough to guarantee a fresh
# image - Portainer's stack webhook redeploys the stack as-is but doesn't
# reliably force a re-pull of an already-cached `:latest` tag. This calls
# Portainer's stack-update API directly with pullImage: true instead,
# which does force it.
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions) - PORTAINER_URL and PORTAINER_API_KEY, plus PORTAINER_STACK_IDS
# and PORTAINER_ENDPOINT_IDS as equal-length space-separated lists (one
# entry per live Portainer deployment - VoucherVault runs on two:
# vouchervault-475 and vouchervault-476). If any is unset, this workflow
# no-ops rather than failing, since not every deployment wants this wired
# up.
#
# Confirmed live (2026-08-23): Portainer/DSM's reverse proxy can stall or
# 504 on the PUT that triggers a redeploy even when the redeploy itself
# succeeds server-side (same "DSM stalls on writes" behavior documented in
# this repo's CLAUDE.md-equivalent for other DSM APIs) - a real redeploy
# of stack 475 landed successfully while the HTTP response back to this
# workflow timed out and got reported as a failure. To avoid that false
# negative, a PUT that errors or comes back non-2xx is followed by polling
# the stack's UpdateDate for a change before actually failing the job.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  redeploy:
    name: Pull image and redeploy via Portainer API
    runs-on: ubuntu-latest

    steps:
      - name: Redeploy stack(s)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_IDS: ${{ secrets.PORTAINER_STACK_IDS }}
          PORTAINER_ENDPOINT_IDS: ${{ secrets.PORTAINER_ENDPOINT_IDS }}
        run: |
          if [ -z "$PORTAINER_URL" ] || [ -z "$PORTAINER_API_KEY" ] || [ -z "$PORTAINER_STACK_IDS" ] || [ -z "$PORTAINER_ENDPOINT_IDS" ]; then
            echo "PORTAINER_URL / PORTAINER_API_KEY / PORTAINER_STACK_IDS / PORTAINER_ENDPOINT_IDS not fully set - skipping. See docs/AUTO_DEPLOY.md to enable this."
            exit 0
          fi

          read -ra STACK_IDS <<< "$PORTAINER_STACK_IDS"
          read -ra ENDPOINT_IDS <<< "$PORTAINER_ENDPOINT_IDS"

          if [ "${#STACK_IDS[@]}" -ne "${#ENDPOINT_IDS[@]}" ]; then
            echo "PORTAINER_STACK_IDS and PORTAINER_ENDPOINT_IDS must have the same number of entries" >&2
            exit 1
          fi

          fail=0
          for i in "${!STACK_IDS[@]}"; do
            stack_id="${STACK_IDS[$i]}"
            endpoint_id="${ENDPOINT_IDS[$i]}"
            echo "== Redeploying stack $stack_id (endpoint $endpoint_id) =="

            file_json=$(curl -sf --max-time 30 -H "X-API-Key: $PORTAINER_API_KEY" \
              "$PORTAINER_URL/api/stacks/$stack_id/file") || { echo "Failed to fetch stack file"; fail=1; continue; }
            stack_json=$(curl -sf --max-time 30 -H "X-API-Key: $PORTAINER_API_KEY" \
              "$PORTAINER_URL/api/stacks/$stack_id") || { echo "Failed to fetch stack details"; fail=1; continue; }

            before_update_date=$(echo "$stack_json" | jq -r '.UpdateDate // 0')
            stack_content=$(echo "$file_json" | jq -r '.StackFileContent')
            env_json=$(echo "$stack_json" | jq -c '.Env // []')

            body=$(jq -n --arg content "$stack_content" --argjson env "$env_json" \
              '{stackFileContent: $content, env: $env, prune: false, pullImage: true}')

            # --max-time 240: a git-based stack's redeploy rebuilds the image
            # synchronously, which can legitimately take minutes - this must
            # outlast that, not just a normal API call.
            status=$(curl -s --max-time 240 -o /tmp/redeploy_response.json -w "%{http_code}" \
              -X PUT \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              -H "Content-Type: application/json" \
              "$PORTAINER_URL/api/stacks/$stack_id?endpointId=$endpoint_id" \
              -d "$body")
            curl_exit=$?

            cat /tmp/redeploy_response.json 2>/dev/null
            echo

            if [ "$curl_exit" -eq 0 ] && [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "Redeploy of stack $stack_id triggered (pullImage=true), HTTP $status"
              continue
            fi

            echo "Redeploy of stack $stack_id got curl_exit=$curl_exit HTTP=$status - Portainer/DSM is known to stall on writes even when they succeed server-side. Polling for a real outcome before failing..."
            confirmed=0
            # 24 attempts x 15s = 6 minutes: confirmed live 2026-08-23 that a
            # 90s window (6 attempts) isn't enough - stack 475's real
            # git-based rebuild completed ~100s after that window closed
            # (UpdateDate advanced, container came back healthy), so the
            # job had already given up and reported a false failure.
            for attempt in $(seq 1 24); do
              sleep 15
              after_json=$(curl -sf --max-time 30 -H "X-API-Key: $PORTAINER_API_KEY" \
                "$PORTAINER_URL/api/stacks/$stack_id") || { echo "  poll $attempt: stack API still unreachable"; continue; }
              after_update_date=$(echo "$after_json" | jq -r '.UpdateDate // 0')
              if [ "$after_update_date" != "$before_update_date" ] && [ "$after_update_date" -gt 0 ]; then
                echo "  poll $attempt: UpdateDate changed ($before_update_date -> $after_update_date) - redeploy actually succeeded"
                confirmed=1
                break
              fi
              echo "  poll $attempt: UpdateDate unchanged ($before_update_date) - still waiting"
            done

            if [ "$confirmed" -ne 1 ]; then
              echo "Redeploy of stack $stack_id failed - no confirmed update after polling"
              fail=1
            fi
          done

          exit $fail
