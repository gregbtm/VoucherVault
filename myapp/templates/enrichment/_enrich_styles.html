<style>
  /* Shared visual language for the enrichment section - stat tiles,
     method cards, chart cards, and a generic card treatment used by the
     config/run/history pages so the whole section feels of a piece. */
  .enrich-stat-card {
    background: var(--card-bg, #fff);
    border-radius: 16px;
    padding: 1.25rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    transition: all 0.25s ease;
    display: flex;
    align-items: flex-start;
    gap: 0.9rem;
    height: 100%;
  }
  .enrich-stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
  .enrich-stat-icon {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 1.35rem;
  }
  .enrich-stat-card.runs .enrich-stat-icon { background: rgba(59, 130, 246, 0.12); color: #3b82f6; }
  .enrich-stat-card.pending .enrich-stat-icon { background: rgba(245, 158, 11, 0.14); color: #f59e0b; }
  .enrich-stat-card.changes .enrich-stat-icon { background: rgba(34, 197, 94, 0.12); color: #22c55e; }
  .enrich-stat-card.confidence .enrich-stat-icon { background: rgba(139, 92, 246, 0.14); color: #8b5cf6; }
  .enrich-stat-value { font-size: 1.6rem; font-weight: 700; line-height: 1.2; color: var(--text-color, #212529); font-variant-numeric: tabular-nums; }
  .enrich-stat-label { color: var(--text-muted, #6c757d); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; line-height: 1.35; }
  .enrich-stat-sub { font-size: 0.78rem; color: var(--text-muted, #6c757d); margin-top: 0.15rem; }

  /* On phones, two stat cards share a row that's barely wider than the
     icon plus a couple of words - "Field changes applied" beside a 46px
     icon had nowhere to go but a cramped three-line wrap, and the row
     height then stretched every other card in the grid to match it. Icon
     above the number/label instead of beside it gives the label the
     card's full width, so it wraps at most once and the four tiles stay
     visually even. */
  @media (max-width: 767.98px) {
    .enrich-stat-card {
      flex-direction: column;
      align-items: flex-start;
      padding: 1.1rem 1.15rem;
      gap: 0.7rem;
    }
    .enrich-stat-icon { width: 42px; height: 42px; font-size: 1.2rem; }
    .enrich-stat-value { font-size: 1.5rem; }
    .enrich-stat-label { font-size: 0.72rem; letter-spacing: 0.3px; }
  }

  .enrich-method-card {
    background: var(--card-bg, #fff);
    border-radius: 14px;
    border: 1px solid rgba(128, 128, 128, 0.14);
    padding: 1.1rem 1.2rem;
    height: 100%;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .enrich-method-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); transform: translateY(-2px); }
  .enrich-method-icon {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
    background: rgba(65, 84, 241, 0.1); color: #4154f1;
  }
  body.dark-mode .enrich-method-icon { background: rgba(90, 108, 241, 0.18); }
  .enrich-progress { height: 6px; border-radius: 999px; background: rgba(128,128,128,0.15); overflow: hidden; margin-top: 0.6rem; }
  .enrich-progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #22c55e, #16a34a); transition: width 0.6s ease; }

  .enrich-chart-card { background: var(--card-bg, #fff); border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); height: 100%; }
  .enrich-donut { width: 100%; height: 220px; }
  .enrich-legend { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; }
  .enrich-legend-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; }
  .enrich-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .enrich-legend-label { color: var(--text-muted, #6c757d); flex: 1; }
  .enrich-legend-count { font-weight: 600; font-variant-numeric: tabular-nums; }

  .enrich-empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted, #6c757d); }
  .enrich-empty-state i { font-size: 2.2rem; opacity: 0.5; display: block; margin-bottom: 0.5rem; }

  .text-tabular { font-variant-numeric: tabular-nums; }

  /* Generic card used on config/run list & detail pages - same rounding,
     shadow, and hover lift as the dashboard's method cards, without
     requiring the stat/chart-specific markup. */
  .enrich-card {
    background: var(--card-bg, #fff);
    border-radius: 16px;
    border: 1px solid rgba(128, 128, 128, 0.1);
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .enrich-card.hoverable:hover { box-shadow: 0 8px 22px rgba(0,0,0,0.09); transform: translateY(-2px); }

  /* Suspicious-value flags (barcode/PIN) - deliberately distinct from a
     green "applied" change: amber, and never shows an old -> new arrow,
     since nothing was actually rewritten. */
  .enrich-flag-row {
    display: flex; align-items: flex-start; gap: 0.5rem;
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.25);
    border-radius: 10px;
    padding: 0.5rem 0.7rem;
    font-size: 0.82rem;
    margin-top: 0.35rem;
  }
  .enrich-flag-row i { color: #f59e0b; margin-top: 0.15rem; flex: none; }
  .enrich-flag-field { font-weight: 600; }

  body.dark-mode .enrich-stat-card,
  body.dark-mode .enrich-method-card,
  body.dark-mode .enrich-chart-card,
  body.dark-mode .enrich-card {
    background-color: #21262d;
    box-shadow: 0px 0 30px rgba(0, 0, 0, 0.5);
  }
  body.dark-mode .enrich-method-card,
  body.dark-mode .enrich-card { border-color: rgba(255, 255, 255, 0.08); }
  body.dark-mode .enrich-stat-value,
  body.dark-mode .enrich-method-card strong { color: #e0e6eb; }
  body.dark-mode .enrich-stat-label,
  body.dark-mode .enrich-legend-label,
  body.dark-mode .enrich-empty-state { color: #9aa5b1; }
  body.dark-mode .enrich-progress { background: rgba(255, 255, 255, 0.1); }
  body.dark-mode .enrich-flag-row { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.3); }
</style>
